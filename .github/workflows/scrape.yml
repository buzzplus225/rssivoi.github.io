name: Scraper RSS Auto

on:
  schedule:
    - cron: '0 */4 * * *'    # Toutes les 4 heures
  workflow_dispatch:          # Déclenchement manuel

permissions:
  contents: write
  pages: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run scraper
      run: python scraper.py
      env:
        RSS_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml"
    
    - name: Commit and push feed.xml
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🔄 Mise à jour automatique du flux RSS"
        file_pattern: feed.xml
        branch: main
    
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: .
    
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4

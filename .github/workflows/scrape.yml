name: Scraper RSS Auto

on:
  schedule:
    - cron: '0 */4 * * *'    # Toutes les 4 heures
  workflow_dispatch:          # Déclenchement manuel

permissions:
  contents: write
  pages: write
  id-token: write            # REQUIS pour actions/deploy-pages

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    # 1. Passage en v4.2.2 (ou simplement @v4 si le tag a été mis à jour par les auteurs)
    - uses: actions/checkout@v4.2.2
    
    # 2. Passage en v5.4.0+ pour le support Node 24
    - name: Setup Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run scraper
      run: python scraper.py
      env:
        RSS_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || github.event.repository.name == '' && github.repository || github.repository }}/feed.xml"
    
    # 3. Passage en v5.1.0+ pour le support Node 24
    - name: Commit and push feed.xml
      uses: stefanzweifel/git-auto-commit-action@v5.1.0
      with:
        commit_message: "🔄 Mise à jour automatique du flux RSS [skip ci]"
        file_pattern: feed.xml
        branch: main
    
    # 4. upload-pages-artifact utilise upload-artifact en interne. Passage en v3.0.1+
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3.0.1
      with:
        path: .
    
    # 5. Passage en v4.0.5+ pour le support officiel de Node 24
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4.0.5

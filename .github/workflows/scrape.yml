name: Scraper RSS Auto

on:
  schedule:
    - cron: '0 */4 * * *'    # Toutes les 4 heures
  workflow_dispatch:          # Déclenchement manuel

permissions:
  contents: write
  pages: write
  id-token: write            # REQUIS pour actions/deploy-pages

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run scraper
      run: python scraper.py
      env:
        RSS_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || github.repository }}/feed.xml"
    
    # ÉTAPE 1 : Sauvegarder le fichier généré dans Git avant de s'occuper de Pages
    - name: Commit and push feed.xml
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🔄 Mise à jour automatique du flux RSS [skip ci]"
        file_pattern: feed.xml
        branch: main

    # ÉTAPE 2 : Nettoyer ou cibler uniquement ce qui doit être publié.
    # Si votre site ne contient QUE le fichier feed.xml à la racine, nous l'envoyons spécifiquement.
    # Si vous avez d'autres fichiers (index.html, etc.), '.' reste correct, mais l'avoir commité avant stabilise l'artefact.
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' 
    
    # ÉTAPE 3 : Déploiement avec la version v4 majeure stable (qui intègre tous les correctifs Node récents)
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

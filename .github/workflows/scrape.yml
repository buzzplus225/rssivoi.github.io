name: Scraper RSS Auto

on:
  schedule:
    - cron: '0 */4 * * *'    # Toutes les 4 heures
  workflow_dispatch:          # Déclenchement manuel

permissions:
  contents: write
  pages: write
  id-token: write            # 1. REQUIS pour actions/deploy-pages

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    # AJOUT DE L'ENVIRONNEMENT ICI
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run scraper
      run: python scraper.py
      env:
        # 2. Utilisation de la variable native simplifiée pour le nom du dépôt
        RSS_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || github.event.repository.name == '' && github.repository || github.repository }}/feed.xml"
    
    - name: Commit and push feed.xml
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🔄 Mise à jour automatique du flux RSS [skip ci]" # 3. Évite la boucle infinie
        file_pattern: feed.xml
        branch: main
    
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: .
    
    - name: Deploy to GitHub Pages
      id: deployment # Ajouté pour alimenter l'URL de l'environnement ci-dessus
      uses: actions/deploy-pages@v4

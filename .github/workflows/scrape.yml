name: Scraper RSS Auto

on:
  schedule:
    - cron: '0 */4 * * *'    # Toutes les 4 heures
  workflow_dispatch:          # Déclenchement manuel

permissions:
  contents: write
  pages: write
  id-token: write            # REQUIS pour actions/deploy-pages

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Assure que l'action récupère bien la branche main avec les droits d'écriture
        ref: main
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run scraper
      run: python scraper.py
      env:
        # Correction de l'URL pour éviter la duplication du nom d'utilisateur dans le chemin
        RSS_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml"
    
    # ÉTAPE 1 : Sauvegarder le fichier généré dans Git avant de s'occuper de Pages
    - name: Commit and push feed.xml
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🔄 Mise à jour automatique du flux RSS [skip ci]"
        file_pattern: feed.xml
        branch: main

    # ÉTAPE 2 : Préparation de l'artefact pour GitHub Pages
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' 
    
    # ÉTAPE 3 : Déploiement de l'artefact sur les serveurs de Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
